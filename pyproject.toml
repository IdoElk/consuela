[project]
name = "consuela"
version = "0.1.0"
description = "Per-file Python implementation audits with Jev."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.14,<1",
    "complexipy>=5,<6",
    "pre-commit>=4,<5",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.complexipy]
max-complexity-allowed = 15

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
